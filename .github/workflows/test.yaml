name: Deterministic tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: npm ci
      - run: npm test
      - run: git diff --check
