{{- if and .Values.build.enabled (eq .Values.environment .Values.build.environment) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.componentName }}-initial-build
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: HookFailed
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: {{ .Values.build.serviceAccountName }}
      restartPolicy: Never
      containers:
        - name: start-and-wait
          image: registry.redhat.io/openshift-pipelines/pipelines-cli-tkn-rhel8:v1.15.4
          command: [/bin/sh, -c]
          args:
            - >-
              tkn pipeline start {{ .Values.componentName }}
              --serviceaccount pipeline
              --param git-url={{ .Values.build.repository }}
              --param git-revision={{ .Values.build.revision }}
              --workspace name=source,volumeClaimTemplateFile=/workspace/source-pvc.yaml
              --workspace name=maven-settings,emptyDir=
              --use-param-defaults --showlog
              --exit-with-pipelinerun-error
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
      volumes:
        - name: workspace
          configMap: {name: {{ .Values.componentName }}-initial-build}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.componentName }}-initial-build
  annotations: {argocd.argoproj.io/sync-wave: "1"}
data:
  source-pvc.yaml: |
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 2Gi
{{- end }}
