apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: {{ .Values.apiName }}-api
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  params:
    - {name: git-revision, value: $(extensions.revision)}
    - {name: release-version, value: ""}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: {{ .Values.apiName }}-api-release
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  params:
    - {name: git-revision, value: $(extensions.tag-revision)}
    - {name: release-version, value: $(extensions.release-version)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: {{ .Values.apiName }}-api
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  params:
    - {name: git-revision, default: {{ .Values.revision | quote }}}
    - {name: release-version, default: ""}
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata: {generateName: {{ .Values.apiName }}-api-}
      spec:
        taskRunTemplate:
          serviceAccountName: pipeline
        taskRunSpecs:
          - pipelineTaskName: publish-git-version
            podTemplate:
              env:
                - {name: APICURIO_AUTH_SERVER_URL, value: {{ .Values.schemaRegistry.authServerUrl | quote }}}
                - {name: APICURIO_CLIENT_ID, valueFrom: {secretKeyRef: {name: apicurio-client, key: client-id}}}
                - {name: APICURIO_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: apicurio-client, key: client-secret}}}
          - pipelineTaskName: publish-release-version
            podTemplate:
              env:
                - {name: APICURIO_AUTH_SERVER_URL, value: {{ .Values.schemaRegistry.authServerUrl | quote }}}
                - {name: APICURIO_CLIENT_ID, valueFrom: {secretKeyRef: {name: apicurio-client, key: client-id}}}
                - {name: APICURIO_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: apicurio-client, key: client-secret}}}
          - pipelineTaskName: microcks-import
            podTemplate:
              env:
                - {name: MICROCKS_URL, value: {{ .Values.microcks.url | quote }}}
                - {name: MICROCKS_CLIENT_ID, valueFrom: {secretKeyRef: {name: microcks-client, key: client-id}}}
                - {name: MICROCKS_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: microcks-client, key: client-secret}}}
        pipelineRef: {name: {{ .Values.apiName }}-api}
        params:
          - {name: git-url, value: {{ .Values.repository | quote }}}
          - {name: git-revision, value: $(tt.params.git-revision)}
          - {name: release-version, value: $(tt.params.release-version)}
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources: {requests: {storage: 1Gi}}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: {{ .Values.apiName }}-api
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  serviceAccountName: {{ .Values.serviceAccountName }}
  triggers:
    - name: main
      interceptors:
        - ref: {name: cel}
          params:
            - {name: filter, value: "body.ref == 'refs/heads/{{ .Values.revision }}'"}
            - name: overlays
              value:
                - {key: revision, expression: "body.after"}
      bindings: [{ref: {{ .Values.apiName }}-api}]
      template: {ref: {{ .Values.apiName }}-api}
    - name: release-tag
      interceptors:
        - ref: {name: cel}
          params:
            - name: filter
              value: >-
                body.ref.matches('^refs/tags/v[0-9]+(\\.[0-9]+){0,2}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') &&
                body.after != '0000000000000000000000000000000000000000'
            - name: overlays
              value:
                - {key: tag-revision, expression: "body.ref"}
                - {key: release-version, expression: "body.ref.split('/')[2]"}
      bindings: [{ref: {{ .Values.apiName }}-api-release}]
      template: {ref: {{ .Values.apiName }}-api}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: el-{{ .Values.apiName }}-api
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  to: {kind: Service, name: el-{{ .Values.apiName }}-api}
  port: {targetPort: http-listener}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
