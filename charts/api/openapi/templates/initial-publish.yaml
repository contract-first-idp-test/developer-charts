apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.apiName }}-api-initial-publish
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: HookFailed
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      restartPolicy: Never
      containers:
        - name: start-and-wait
          image: registry.redhat.io/openshift4/ose-cli
          command: [/bin/sh, -ec]
          args:
            - |
              run="$(oc create -f /workspace/pipelinerun.yaml -o name)"
              run_name="${run##*/}"
              deadline="$(( $(date +%s) + 30 * 60 ))"
              while true; do
                condition="$(oc get "$run" -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}{"|"}{.status.conditions[?(@.type=="Succeeded")].reason}{"|"}{.status.conditions[?(@.type=="Succeeded")].message}')"
                status="${condition%%|*}"
                details="${condition#*|}"
                reason="${details%%|*}"
                message="${details#*|}"
                case "$status" in
                  True)
                    echo "PipelineRun $run_name succeeded"
                    exit 0
                    ;;
                  False)
                    echo "PipelineRun $run_name failed: ${reason:-UnknownReason}: ${message:-No message reported}" >&2
                    exit 1
                    ;;
                esac
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "Timed out after 30m waiting for PipelineRun $run_name; last condition: ${status:-Unknown} ${reason:-UnknownReason}: ${message:-No message reported}" >&2
                  exit 1
                fi
                sleep 2
              done
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
      volumes:
        - name: workspace
          configMap: {name: {{ .Values.apiName }}-api-initial-publish}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.apiName }}-api-initial-publish
  annotations: {argocd.argoproj.io/sync-wave: "1"}
data:
  pipelinerun.yaml: |
    apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      generateName: {{ .Values.apiName }}-api-initial-
    spec:
      taskRunTemplate:
        serviceAccountName: pipeline
      taskRunSpecs:
        - pipelineTaskName: publish-git-version
          podTemplate:
            env:
              - {name: APICURIO_AUTH_SERVER_URL, value: {{ .Values.schemaRegistry.authServerUrl | quote }}}
              - {name: APICURIO_CLIENT_ID, valueFrom: {secretKeyRef: {name: apicurio-client, key: client-id}}}
              - {name: APICURIO_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: apicurio-client, key: client-secret}}}
        - pipelineTaskName: publish-release-version
          podTemplate:
            env:
              - {name: APICURIO_AUTH_SERVER_URL, value: {{ .Values.schemaRegistry.authServerUrl | quote }}}
              - {name: APICURIO_CLIENT_ID, valueFrom: {secretKeyRef: {name: apicurio-client, key: client-id}}}
              - {name: APICURIO_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: apicurio-client, key: client-secret}}}
        - pipelineTaskName: microcks-import
          podTemplate:
            env:
              - {name: MICROCKS_URL, value: {{ .Values.microcks.url | quote }}}
              - {name: MICROCKS_CLIENT_ID, valueFrom: {secretKeyRef: {name: microcks-client, key: client-id}}}
              - {name: MICROCKS_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: microcks-client, key: client-secret}}}
      pipelineRef: {name: {{ .Values.apiName }}-api}
      params:
        - {name: git-url, value: {{ .Values.repository | quote }}}
        - {name: git-revision, value: {{ .Values.revision | quote }}}
      workspaces:
        - name: source
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources: {requests: {storage: 1Gi}}
