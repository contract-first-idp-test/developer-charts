apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: assert-image-tag-compatible
  namespace: {{ .Values.systemName }}{{ .Values.environment.namespaceSuffix }}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  description: Refuse to reassign an existing human image tag to a different digest.
  params:
    - {name: source-image, type: string}
    - {name: destination-image, type: string}
  results:
    - {name: sourceDigest, description: Digest resolved from the source image.}
    - {name: destinationDigest, description: Existing destination digest, if present.}
    - {name: destinationExists, description: Whether the destination tag already exists.}
  steps:
    - name: compare-digests
      image: quay.io/skopeo/stable:v1.17.0
      env:
        - {name: SOURCE_IMAGE, value: $(params.source-image)}
        - {name: DESTINATION_IMAGE, value: $(params.destination-image)}
      script: |
        #!/bin/sh
        set -eu

        auth_file="${HOME:-/tekton/home}/.docker/config.json"
        inspect_digest() {
          if [ -s "$auth_file" ]; then
            skopeo inspect --authfile "$auth_file" --format '{{ "{{.Digest}}" }}' "$1"
          else
            skopeo inspect --format '{{ "{{.Digest}}" }}' "$1"
          fi
        }

        source_digest="$(inspect_digest "$SOURCE_IMAGE")"
        case "$source_digest" in
          sha256:*) ;;
          *) echo "Source image did not resolve to a valid digest." >&2; exit 1 ;;
        esac

        destination_digest=
        destination_exists=false
        if destination_digest="$(inspect_digest "$DESTINATION_IMAGE" 2>/dev/null)"; then
          destination_exists=true
          if [ "$destination_digest" != "$source_digest" ]; then
            echo "Requested human release version already refers to a different image digest; refusing reassignment." >&2
            exit 1
          fi
        fi

        printf '%s' "$source_digest" >"$(results.sourceDigest.path)"
        printf '%s' "$destination_digest" >"$(results.destinationDigest.path)"
        printf '%s' "$destination_exists" >"$(results.destinationExists.path)"
