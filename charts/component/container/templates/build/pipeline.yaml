{{- if and .Values.build.enabled (eq .Values.environment .Values.build.environment) }}
{{- $recipe := include "component.buildRecipe" . | fromYaml }}
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: {{ .Values.componentName }}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
  labels:
    backstage.io/kubernetes-id: {{ .Values.componentName }}
    contract-first-idp.github.io/system: {{ .Values.systemName }}
    contract-first-idp.github.io/component: {{ .Values.componentName }}
    contract-first-idp.github.io/environment: {{ .Values.environment }}
spec:
  params:
    - {name: git-url, type: string, default: {{ .Values.build.repository | quote }}}
    - {name: git-revision, type: string, default: {{ .Values.build.revision | quote }}}
    - {name: image-repository, type: string, default: {{ .Values.build.imageRepository | quote }}}
    - {name: release-version, type: string, default: ""}
  workspaces:
    - {name: source}
    - {name: maven-settings}
  tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: git-clone}
          - {name: namespace, value: openshift-pipelines}
      params:
        - {name: URL, value: $(params.git-url)}
        - {name: REVISION, value: $(params.git-revision)}
        - {name: DELETE_EXISTING, value: "true"}
        - {name: SUBDIRECTORY, value: source}
      workspaces: [{name: output, workspace: source}]
    - name: package
      runAfter: [clone]
      when:
        - {input: $(params.release-version), operator: in, values: [""]}
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: {{ $recipe.task }}}
          - {name: namespace, value: {{ $recipe.taskNamespace }}}
      params:
{{- if eq $recipe.executor "maven" }}
        - name: GOALS
          value:
{{ toYaml $recipe.goals | indent 12 }}
        - {name: MAVEN_IMAGE, value: {{ $recipe.builderImage | quote }}}
{{- else if eq $recipe.executor "script" }}
        - name: SCRIPT
          value: |
{{ $recipe.script | indent 12 }}
{{- else }}
{{- fail (printf "unsupported package executor %q" $recipe.executor) }}
{{- end }}
      workspaces:
        - {name: source, workspace: source, subPath: source}
{{- if eq $recipe.executor "maven" }}
        - {name: maven_settings, workspace: maven-settings}
{{- end }}
    - name: build-and-push
      runAfter: [package]
      when:
        - {input: $(params.release-version), operator: in, values: [""]}
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: buildah}
          - {name: namespace, value: openshift-pipelines}
      params:
        - {name: IMAGE, value: $(params.image-repository):git-$(tasks.clone.results.COMMIT)}
        - {name: DOCKERFILE, value: {{ $recipe.dockerfilePath | quote }}}
      workspaces: [{name: source, workspace: source, subPath: source}]
    - name: publish-latest
      runAfter: [build-and-push]
      when:
        - {input: $(params.release-version), operator: in, values: [""]}
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: skopeo-copy}
          - {name: namespace, value: openshift-pipelines}
      params:
        - name: SOURCE_IMAGE_URL
          value: docker://$(params.image-repository):git-$(tasks.clone.results.COMMIT)
        - name: DESTINATION_IMAGE_URL
          value: docker://$(params.image-repository):latest
        - name: SRC_TLS_VERIFY
          value: "true"
        - name: DEST_TLS_VERIFY
          value: "true"
{{- if eq (.Values.build.deploymentUpdate.strategy | default "restart") "restart" }}
    - name: restart-runtime
      runAfter: [publish-latest]
      when:
        - {input: $(params.release-version), operator: in, values: [""]}
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: openshift-client}
          - {name: namespace, value: openshift-pipelines}
      params:
        - name: SCRIPT
          value: |
            if ! oc get deployment/{{ .Values.componentName }} -n {{ .Values.namespace }} >/dev/null 2>&1; then
              echo "Deployment is not present yet; initial image build is complete."
              exit 0
            fi
            oc rollout restart deployment/{{ .Values.componentName }} -n {{ .Values.namespace }}
            oc rollout status deployment/{{ .Values.componentName }} -n {{ .Values.namespace }} --timeout=2m
{{- end }}
    - name: assert-release-version
      runAfter: [clone]
      when:
        - {input: $(params.release-version), operator: notin, values: [""]}
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: assert-image-tag-compatible}
          - {name: namespace, value: tekton-tasks}
      params:
        - name: source-image
          value: docker://$(params.image-repository):git-$(tasks.clone.results.COMMIT)
        - name: destination-image
          value: docker://$(params.image-repository):$(params.release-version)
    - name: materialize-release
      runAfter: [assert-release-version]
      when:
        - {input: $(params.release-version), operator: notin, values: [""]}
      taskRef:
        resolver: cluster
        params:
          - {name: kind, value: task}
          - {name: name, value: skopeo-copy}
          - {name: namespace, value: openshift-pipelines}
      params:
        - name: SOURCE_IMAGE_URL
          value: docker://$(params.image-repository)@$(tasks.assert-release-version.results.sourceDigest)
        - name: DESTINATION_IMAGE_URL
          value: docker://$(params.image-repository):$(params.release-version)
        - {name: SRC_TLS_VERIFY, value: "true"}
        - {name: DEST_TLS_VERIFY, value: "true"}
{{- end }}
