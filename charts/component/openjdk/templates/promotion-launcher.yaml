{{- if and (ne .Values.environment .Values.build.environment) .Values.image.tag }}
{{- if not (regexMatch "^v[0-9]+(\\.[0-9]+){0,2}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$" .Values.image.tag) }}{{ fail "promotion requires an immutable human release such as v1.7.3" }}{{- end }}
{{- if not .Values.promotion.sourceEnvironment }}{{ fail "non-build release requires an adjacent source environment" }}{{- end }}
{{- $componentPrefix := .Values.componentName | trunc 45 | trimSuffix "-" }}
{{- $releaseIdentity := printf "%s:%s:%s" .Values.componentName .Values.environment .Values.image.tag }}
{{- $releaseHash := sha256sum $releaseIdentity | trunc 8 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $componentPrefix }}-promote-{{ $releaseHash }}
  namespace: {{ .Values.namespace }}
  labels:
    backstage.io/kubernetes-id: {{ .Values.componentName }}
    contract-first-idp.github.io/system: {{ .Values.systemName }}
    contract-first-idp.github.io/component: {{ .Values.componentName }}
    contract-first-idp.github.io/environment: {{ .Values.environment }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Replace=true
    contract-first-idp.github.io/source-environment: {{ .Values.promotion.sourceEnvironment | quote }}
    contract-first-idp.github.io/release-tag: {{ .Values.image.tag | quote }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        contract-first-idp.github.io/system: {{ .Values.systemName }}
        contract-first-idp.github.io/component: {{ .Values.componentName }}
        contract-first-idp.github.io/environment: {{ .Values.environment }}
    spec:
      serviceAccountName: {{ .Values.promotion.serviceAccountName }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-promotion-pipeline
          image: quay.io/openshift/origin-cli:4.16
          env:
            - {name: TARGET_NAMESPACE, value: {{ .Values.namespace | quote }}}
            - {name: PIPELINE_NAME, value: {{ .Values.promotion.pipelineName | quote }}}
          command: [/bin/sh, -c]
          args:
            - |
              set -u
              attempt=1
              max_attempts=31
              retry_seconds=10
              while ! oc get pipeline.tekton.dev "$PIPELINE_NAME" \
                -n "$TARGET_NAMESPACE" >/dev/null 2>&1; do
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Timed out waiting for the target promotion Pipeline after 300 seconds." >&2
                  oc get pipeline.tekton.dev "$PIPELINE_NAME" -n "$TARGET_NAMESPACE"
                  exit 1
                fi
                sleep "$retry_seconds"
                attempt=$((attempt + 1))
              done
      containers:
        - name: start-promotion
          image: registry.redhat.io/openshift-pipelines/pipelines-cli-tkn-rhel8:v1.15.4
          env:
            - {name: COMPONENT, value: {{ .Values.componentName | quote }}}
            - {name: IMAGE_TAG, value: {{ .Values.image.tag | quote }}}
            - {name: TARGET_NAMESPACE, value: {{ .Values.namespace | quote }}}
            - {name: PIPELINE_NAME, value: {{ .Values.promotion.pipelineName | quote }}}
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              tkn pipeline start "$PIPELINE_NAME" \
                -n "$TARGET_NAMESPACE" \
                --serviceaccount pipeline \
                --param component="$COMPONENT" \
                --param image-tag="$IMAGE_TAG" \
                --use-param-defaults
              echo "Tekton confirmed target-local PipelineRun creation."
{{- end }}
